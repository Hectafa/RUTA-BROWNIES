name: Compilar APK de Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Probar lógica de recordatorios
        run: npm test

      - name: Compilar la app web y copiarla a Android
        run: |
          npm run build
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../ruta-brownies.apk

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ruta-brownies-apk
          path: ruta-brownies.apk

      - name: Publicar APK para descargar desde el celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Ruta de Brownies (última versión)
          body: "Abre este enlace desde tu celular Android y descarga ruta-brownies.apk para instalarla."
          files: ruta-brownies.apk
          make_latest: true
