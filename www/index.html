<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F6F2EE">
<title>Ruta de Brownies</title>
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem("rb-tema");if(t)document.documentElement.setAttribute("data-theme",t==="oscuro"?"dark":"light")}catch(e){}</script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Ruta de Brownies</h1>
      <div class="brand-right">
      <button class="theme-btn" id="themeBtn" aria-label="Cambiar a modo oscuro">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="bell" id="bell" aria-label="Recordatorio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span id="bellHora">08:00</span>
      </button>
      </div>
    </div>
    <span class="today" id="todayLabel"></span>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-view="ruta">Ruta</button>
      <button class="tab" role="tab" aria-selected="false" data-view="negocios">Negocios</button>
      <button class="tab" role="tab" aria-selected="false" data-view="stats">Estadísticas</button>
    </nav>
  </div>
</header>
<main><div class="wrap" id="view"></div></main>
<button class="btn primary fab" id="fab">+ Registrar entrega</button>
<div id="sheetHost"></div>
<div id="toastHost"></div>
<script src="app.js"></script>
</body>
</html>
